services:
  ollama:
    image: ollama/ollama
    container_name: kgwiki-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  kgwiki:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kgwiki-app
    ports:
      - "8765:8765"
    volumes:
      - ./output:/app/output
    environment:
      OLLAMA_URL: http://ollama:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
